<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0a1020"><title>鉱脈∞</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1020;color:#edf5ff;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.app{max-width:700px;margin:auto;padding:14px 12px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.logo{font-size:24px;font-weight:900;letter-spacing:2px}.logo b{color:#63e5ff}.sub{font-size:10px;color:#92a9c8}.pill,.stat,.panel{background:#142139;border:1px solid #304563;border-radius:14px;padding:11px}.pill{font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.stat small{display:block;color:#9aafcc;font-size:10px}.stat strong{display:block;font-size:20px;margin-top:4px}.field{border:1px solid #3b5577;border-radius:18px;overflow:hidden;background:#101b2d;margin-bottom:10px}.fieldtop{padding:12px;display:flex;justify-content:space-between;font-size:12px;background:#0c1627}.fieldtop span{color:#a2b5ce}canvas{width:100%;height:290px;display:block;touch-action:manipulation}.hint{padding:10px;background:#0c1627;color:#b9cbe3;font-size:11px}.panel{margin-top:10px}.panel h2{font-size:14px;margin:0 0 10px}.muted{color:#9aafcc;font-size:11px;line-height:1.5}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.tabs button,button{border:1px solid #3b5577;border-radius:11px;background:linear-gradient(#263b5a,#17243b);color:#edf5ff;padding:11px 8px;font-weight:800;font-size:12px}.tabs button.active{border-color:#63e5ff;color:#63e5ff}.node{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid #304563;border-radius:12px;background:#101b2d;margin:8px 0}.node.done{border-color:#347b68;background:#102a2b}.ico{font-size:22px;width:38px;text-align:center}.body{flex:1;min-width:0}.name{font-weight:900;font-size:12px}.desc{font-size:10px;color:#9aafcc;line-height:1.45;margin-top:4px}.cost{font-size:10px;color:#ffd166;margin-top:4px}.node button{min-width:65px;padding:9px 7px}.node button:disabled{opacity:.35}.label{font-size:11px;color:#63e5ff;letter-spacing:1px;font-weight:900;margin-top:16px}.notice{padding:11px;border:1px solid #315d76;background:#13283b;border-radius:12px;font-size:11px;line-height:1.5}.oregrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.ore{background:#101b2d;border:1px solid #304563;border-radius:11px;padding:10px;font-size:12px}.ore small{display:block;color:#9aafcc;font-size:10px;margin-top:5px}.bottom{position:fixed;bottom:0;left:0;right:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#090e1cf2;border-top:1px solid #304563}.bottomin{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#e8faff;color:#122039;padding:10px 15px;border-radius:30px;font-weight:900;font-size:12px;opacity:0;pointer-events:none}.toast.show{opacity:1}@media(min-width:500px){canvas{height:340px}}
</style></head><body><div class="app">
<header><div><div class="logo">鉱脈<b>∞</b></div><div class="sub">ORE VEIN INFINITY · PROTOTYPE</div></div><div class="pill" id="stage">第1鉱区 · 岩石</div></header>
<div class="stats"><div class="stat"><small>採掘報酬</small><strong id="money">0</strong></div><div class="stat"><small>攻撃力</small><strong id="atk">1</strong></div><div class="stat"><small>採掘速度</small><strong id="spd">1.0<span style="font-size:10px">回/秒</span></strong></div></div>
<div class="field"><div class="fieldtop"><b>⛏ 採掘フィールド</b><span id="count">鉱石 0個</span></div><canvas id="field"></canvas><div class="hint" id="hint">鉱石をタップして採掘！ 岩石を壊して報酬を集めよう。</div></div>
<div id="content"></div></div>
<div class="bottom"><div class="bottomin"><button class="active" data-tab="mine">⛏ 採掘</button><button data-tab="skills">✦ スキルツリー</button><button data-tab="ores">▦ 鉱石図鑑</button></div></div><div id="toast" class="toast"></div>
<script>
(()=>{const $=id=>document.getElementById(id),cv=$('field'),cx=cv.getContext('2d');
const defs=[{id:'rock',n:'岩石',e:'🪨',c:'#8595a9',hp:4,r:1,w:10,u:0},{id:'copper',n:'銅鉱石',e:'🟤',c:'#e38b55',hp:12,r:5,w:1,u:1},{id:'iron',n:'鉄鉱石',e:'⚙️',c:'#bdc9d8',hp:40,r:20,w:1,u:2},{id:'silver',n:'銀鉱石',e:'🌑',c:'#e2e8f0',hp:120,r:75,w:1,u:3},{id:'gold',n:'金鉱石',e:'🟡',c:'#ffd166',hp:350,r:250,w:1,u:4},{id:'ruby',n:'ルビー鉱石',e:'🔴',c:'#ff596f',hp:1000,r:800,w:1,u:5},{id:'emerald',n:'エメラルド鉱石',e:'🟢',c:'#56e39f',hp:3000,r:2500,w:1,u:6},{id:'sapphire',n:'サファイア鉱石',e:'🔵',c:'#5aa9ff',hp:10000,r:9000,w:1,u:7}];
const s={money:0,atk:1,spd:1,unlocks:0,tab:'mine',mined:0,L:{atk:0,spd:0,stone:0,regen:0,copper:0,gain:0},field:[]};let W=0,H=0,dpr=1,toastTimer;
const costs={atk:[4,8,15,25,40,65,100,150,220,320],spd:[8,15,25,40,60],stone:[5,10,18,28,42,60,85,115,150,200],regen:[8,12,18,25,35,50,70,95,125,165],copper:[20,30,45,65,90,120,155,195,240,290],gain:[30,50,80,120,175]};
function msg(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500)}
function fmt(n){return Math.floor(n).toLocaleString('ja-JP')}function pool(){return defs.filter(o=>o.u<=s.unlocks)}function maxO(){return 5+s.L.regen*2}
function spawn(){if(s.field.length>=maxO())return;let p=pool(),ws=p.map(o=>o.id==='rock'?10:o.id==='copper'?1+s.L.copper*.9:1),sum=ws.reduce((a,b)=>a+b,0),r=Math.random()*sum,chosen=p[0];for(let i=0;i<p.length;i++){r-=ws[i];if(r<=0){chosen=p[i];break}}s.field.push({id:chosen.id,hp:chosen.hp,max:chosen.hp,phase:Math.random()*6.28,x:0,y:0})}
function fill(){while(s.field.length<maxO())spawn()}function resize(){let r=cv.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);draw()}
function draw(){if(!W)return;cx.clearRect(0,0,W,H);cx.fillStyle='#0d1929';cx.fillRect(0,0,W,H);for(let i=0;i<28;i++){cx.fillStyle='#b8d9ff18';cx.fillRect((i*71+13)%W,(i*43+17)%H,2,2)}let cols=W<400?3:4,cw=W/cols,ch=H/Math.ceil(maxO()/cols);s.field.forEach((o,i)=>{let x=cw*((i%cols)+.5),y=ch*(Math.floor(i/cols)+.5),r=Math.min(cw*.31,ch*.31,35),d=defs.find(z=>z.id===o.id);o.x=x;o.y=y;cx.save();cx.translate(x,y);cx.rotate(Math.sin(o.phase)*.035);cx.shadowBlur=12;cx.shadowColor=d.c;cx.fillStyle=o.id==='rock'?'#68788d':d.c;cx.beginPath();cx.moveTo(-r*.85,-r*.35);cx.lineTo(-r*.45,-r*.85);cx.lineTo(r*.35,-r*.78);cx.lineTo(r*.88,-r*.2);cx.lineTo(r*.65,r*.6);cx.lineTo(-r*.1,r*.88);cx.lineTo(-r*.78,r*.45);cx.closePath();cx.fill();cx.shadowBlur=0;cx.strokeStyle='#ffffff66';cx.lineWidth=2;cx.beginPath();cx.moveTo(-r*.45,-r*.6);cx.lineTo(-r*.05,-r*.08);cx.lineTo(r*.35,-r*.38);cx.stroke();cx.fillStyle='#07111e';cx.fillRect(-r*.65,r*.98,r*1.3,4);cx.fillStyle='#71edc0';cx.fillRect(-r*.65,r*.98,r*1.3*Math.max(0,o.hp/o.max),4);cx.restore();cx.fillStyle='#eaf3ff';cx.font='bold 10px sans-serif';cx.textAlign='center';cx.fillText(d.n,x,y+r+14)});$('count').textContent=`鉱石 ${s.field.length}個`}
function refreshStats(){$('money').textContent=fmt(s.money);$('atk').textContent=s.atk;$('spd').innerHTML=s.spd.toFixed(1)+'<span style="font-size:10px">回/秒</span>'}
function buy(id){let l=s.L,cost=0;if(id==='atk')cost=costs.atk[l.atk];if(id==='spd')cost=costs.spd[l.spd];if(id==='stone')cost=costs.stone[l.stone];if(id==='regen')cost=costs.regen[l.regen];if(id==='copper')cost=costs.copper[l.copper];if(id==='gain')cost=costs.gain[l.gain];if(id==='copperUnlock')cost=12;if(id==='ironUnlock')cost=150;if(cost==null)return;if(s.money<cost){msg('報酬が足りないよ！');return}s.money-=cost;
if(id==='atk'){l.atk++;s.atk=1+l.atk}if(id==='spd'){l.spd++;s.spd=1+l.spd*.18}if(id==='stone')l.stone++;if(id==='regen'){l.regen++;fill()}if(id==='copper')l.copper++;if(id==='gain')l.gain++;if(id==='copperUnlock'){s.unlocks=1;msg('銅鉱石解放！');fill()}if(id==='ironUnlock'){s.unlocks=2;msg('鉄鉱石解放！ 転生・範囲破壊・雷撃連鎖が解放！');fill()}refreshStats();render();draw()}
function node(id,icon,name,desc,cost,level,max,can,done){let full=max&&level>=max;return `<div class="node ${done?'done':''}"><div class="ico">${icon}</div><div class="body"><div class="name">${name}${max?` <span class="muted">Lv.${level}/${max}</span>`:''}</div><div class="desc">${desc}</div><div class="cost">${done&&!max?'解放済み':full?'MAX':'必要報酬：'+fmt(cost||0)}</div></div><button data-buy="${id}" ${(!can||done||full)?'disabled':''}>${done&&!max?'取得済み':full?'MAX':max?'強化':'解放'}</button></div>`}
function render(){let el=$('content');if(s.tab==='mine'){el.innerHTML=`<div class="panel"><h2>採掘状況 <span class="muted">破壊数 ${fmt(s.mined)}</span></h2><div class="muted">鉱石をタップして報酬を獲得。スキルを強化して採掘を効率化しよう。</div><div class="muted" style="margin-top:8px">鉄鉱石解放：銅鉱石解放後、銅鉱石追加Lv.1以上で解放可能。</div><button style="width:100%;margin-top:10px" data-goto="skills">✦ スキルツリーを開く</button></div><div class="panel"><h2>現在の鉱脈</h2><div class="oregrid">${pool().map(o=>`<div class="ore">${o.e} ${o.n}<small>耐久 ${fmt(o.hp)} · 報酬 ${fmt(o.r)}</small></div>`).join('')}</div></div>`}
if(s.tab==='skills'){let l=s.L;el.innerHTML=`<div class="notice">序盤のスキルツリー。上段は採掘強化、下段は鉱石収集。強化すると鉱脈が育ち、鉄鉱石解放で次の成長段階へ。</div><div class="label">▲ ROUTE 01 · 採掘強化</div>${node('atk','⚔️','攻撃力強化 I','強化1回につき攻撃力 +1。岩石の破壊回数を減らす。',costs.atk[l.atk],l.atk,10,true,false)}${node('spd','⏱','採掘速度 I','採掘速度 +18% / Lv。',costs.spd[l.spd],l.spd,5,l.atk>=1,false)}<div class="label">▼ ROUTE 02 · 鉱石収集</div>${node('stone','🪨','石の報酬アップ','岩石報酬 +1 / Lv。最大Lv.10。',costs.stone[l.stone],l.stone,10,true,false)}${node('regen','🌱','鉱脈再生 I','最大Lv.10。同時出現枠 +2 / Lv。採掘後に鉱石がポコポコ補充される。',costs.regen[l.regen],l.regen,10,l.stone>=1,false)}${node('copperUnlock','🟤','銅鉱石解放','銅鉱石が出現候補に追加される。',12,0,0,l.regen>=1,s.unlocks>=1)}${node('copper','➕','銅鉱石追加','銅鉱石の相対出現率を上げる。最大Lv.10。',costs.copper[l.copper],l.copper,10,s.unlocks>=1,false)}${node('gain','📦','鉱石獲得量 I','すべての鉱石報酬 +15% / Lv。最大Lv.5。',costs.gain[l.gain],l.gain,5,s.unlocks>=1,false)}<div class="label">◆ MILESTONE · 鉄鉱石</div>${node('ironUnlock','⚙️','鉄鉱石解放','報酬150。鉄鉱石・転生・範囲破壊・雷撃連鎖が解放。',150,0,0,s.unlocks>=1&&l.copper>=1,s.unlocks>=2)}${s.unlocks>=2?'<div class="notice">🎉 鉄鉱石解放！ 試作版の目標を達成。転生・範囲破壊・雷撃連鎖の解放を確認できるよ。</div>':''}`}
if(s.tab==='ores'){el.innerHTML=`<div class="panel"><h2>鉱石図鑑 <span class="muted">${pool().length}/8 解放</span></h2><div class="oregrid">${defs.map(o=>`<div class="ore" style="opacity:${o.u<=s.unlocks?1:.42}">${o.u<=s.unlocks?o.e:'🔒'} ${o.u<=s.unlocks?o.n:'未発見鉱石'}<small>${o.u<=s.unlocks?`耐久 ${fmt(o.hp)} · 報酬 ${fmt(o.r)}`:'スキルで解放'}</small></div>`).join('')}</div><button style="width:100%;margin-top:12px" data-goto="skills">スキルツリーへ</button></div>`}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.buy)buy(b.dataset.buy);if(b.dataset.goto){s.tab=b.dataset.goto;syncTabs();render()}if(b.dataset.tab){s.tab=b.dataset.tab;syncTabs();render()}});
function syncTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===s.tab))}
cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,idx=-1,dist=Infinity;s.field.forEach((o,i)=>{let d=(o.x-x)**2+(o.y-y)**2;if(d<dist){dist=d;idx=i}});if(idx<0||dist>Math.min(W/3,H/3)**2)return;let o=s.field[idx],d=defs.find(z=>z.id===o.id);o.hp-=s.atk;if(o.hp<=0){let reward=d.r+(o.id==='rock'?s.L.stone:0);reward=Math.floor(reward*(1+s.L.gain*.15));s.money+=reward;s.mined++;s.field.splice(idx,1);spawn();msg(`${d.n}を破壊！ +${reward}`)}refreshStats();render();draw()});
function animate(){s.field.forEach(o=>o.phase+=.02);draw();requestAnimationFrame(animate)}
fill();refreshStats();render();resize();addEventListener('resize',resize);requestAnimationFrame(animate);
})();
</script></body></html>
